<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高等進学塾 高2東京医進数学「技 完全攻略への道」</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cover-screen" class="cover-screen">
    <div class="cover-glow"></div>

    <div class="cover-logo">
      <div class="cover-subtitle">高等進学塾　高2東京医進数学</div>
      <div class="cover-title"><span class="cover-title-gold">「<span class="cover-title-accent">技</span>」</span>完全攻略への道</div>
    </div>

    <div class="cover-term-label">学期を選択</div>
    <div class="cover-term-buttons" id="cover-term-buttons"></div>

    <button type="button" id="cover-start-btn" class="cover-start-btn disabled" onclick="startFromCover()">START</button>

    <div class="cover-howto">このアプリの使い方 <span class="cover-howto-note">（重要）</span></div>

    <div class="cover-device-block">
      <div class="cover-device-heading">▼ 機種変更する方へ ▼</div>
      <div class="cover-device-buttons">
        <button type="button" onclick="exportRecords()">📤 履歴を書き出す</button>
        <label class="backup-import-label">
          📥 履歴を読み込む
          <input type="file" accept="application/json" onchange="importRecords(event)">
        </label>
      </div>
    </div>

    <button type="button" class="cover-version cover-version-btn" onclick="openChangelogModal()">アプリ ver <span id="cover-version-text"></span>　更新履歴 ＞</button>
    <div class="cover-version">© 高等進学塾／designed by Masahiro Imura</div>
  </div>

  <div id="main-screen" class="app" style="display:none;">
    <div class="content">
      <button type="button" class="back-to-cover-btn" onclick="showCoverScreen()">＜ ホーム画面へ</button>

      <div class="unit-select-wrap">
        <select id="unit-select" class="chapter-badge" onchange="switchUnit(this.value)"></select>
      </div>

      <div class="tab-buttons">
        <button id="tab-all" class="tab-btn active" onclick="showView('all')">すべての問題</button>
        <button id="tab-homeworkSSSA" class="tab-btn" onclick="showView('homeworkSSSA')">提出必須のみ(SS/SA)</button>
        <button id="tab-homeworkSBCT" class="tab-btn" onclick="showView('homeworkSBCT')">提出必須のみ(SBC/T)</button>
        <button id="tab-review" class="tab-btn" onclick="showView('review')">要復習のみ</button>
        <button id="tab-unpracticed" class="tab-btn" onclick="showView('unpracticed')">未演習のみ</button>
        <button id="tab-mistakes" class="tab-btn" onclick="showView('mistakes')">ミス一覧</button>
        <button id="tab-checkpoints" class="tab-btn" onclick="showView('checkpoints')">Check Point一覧</button>
      </div>

      <div class="legend">
        <span class="legend-label">評価基準：</span>
        <span><b class="legend-A">A</b>=楽勝で解けた</span>
        <span><b class="legend-B">B</b>=ミスはあったがほぼ解けてた</span>
        <span><b class="legend-C">C</b>=ヒントを見ることにより解けた</span>
        <span><b class="legend-D">D</b>=あんまり解けなかった</span>
        <span><b class="legend-E">E</b>=全然解けなかった</span>
      </div>

      <div id="problem-list"></div>
      <div id="mistake-list" style="display:none;"></div>
      <div id="checkpoint-list" style="display:none;"></div>
    </div>
  </div>

  <div id="mistake-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3>ミス内容を選択してください（複数選択可）</h3>
      <div id="mistake-chip-list" class="mistake-chip-list"></div>
      <input type="text" id="mistake-other-input" class="mistake-other-input" placeholder="その他（自由記載）">
      <div class="modal-buttons">
        <button class="modal-cancel" onclick="closeMistakeModal()">キャンセル</button>
        <button class="modal-save" onclick="confirmMistakeModal()">保存</button>
      </div>
    </div>
  </div>

  <div id="changelog-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h3>更新履歴</h3>
      <div id="changelog-list"></div>
      <div class="modal-buttons">
        <button class="modal-cancel" onclick="closeChangelogModal()">閉じる</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
